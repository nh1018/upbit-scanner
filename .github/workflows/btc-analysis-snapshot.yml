name: BTC Analysis Snapshot V1

on:
  workflow_dispatch:
  workflow_run:
    workflows: [BTC Entry Timing Engine V1]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'btc_anytime/analysis_snapshot.py'
      - 'btc_anytime/tests/test_analysis_snapshot.py'
      - 'output_direction/btc_anytime/v1/performance/context_latest.json'
      - '.github/workflows/btc-analysis-snapshot.yml'
  schedule:
    - cron: '5,20,35,50 * * * *'

permissions:
  contents: write

concurrency:
  group: btc-analysis-snapshot-v1
  cancel-in-progress: false

jobs:
  snapshot:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate analysis snapshot module
        run: python -B -m unittest btc_anytime.tests.test_analysis_snapshot
      - name: Project existing artifacts; no API or engine replay
        run: python -B -m btc_anytime.analysis_snapshot --repo . --write
      - name: Publish only the complete latest analysis Snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- output_btc_anytime/latest_analysis.json
          if git diff --cached --quiet; then exit 0; fi
          python -B - <<'PY'
          import json,subprocess
          from btc_anytime.analysis_snapshot import validate
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if paths!=['output_btc_anytime/latest_analysis.json']:raise SystemExit('Unexpected staged file')
          validate(json.loads(subprocess.check_output(['git','show',':output_btc_anytime/latest_analysis.json'])))
          PY
          git commit -m 'Update BTC analysis Snapshot'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            # A conflicting latest Snapshot fails closed; never force or overwrite remote.
            git rebase origin/main
          done
          exit 1
