name: BTC Direction Performance Evaluation V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'btc_anytime/direction/evaluation/**'
      - 'btc_anytime/tests/test_performance_context.py'
      - '.github/workflows/btc-direction-evaluation.yml'
  workflow_run:
    workflows: [BTC Feature Availability Evidence, BTC Direction Signal History V1]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '8,23,38,53 * * * *'

permissions:
  contents: write

concurrency:
  group: btc-direction-evaluation-v1
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate performance context module
        run: python -B -m unittest discover -s btc_anytime/tests -p 'test_performance_context.py'
      - name: Record existing prospective outcomes
        id: record
        run: python -B -m btc_anytime.direction.evaluation.production --repo . --record
      - name: Build cumulative performance aggregate
        run: python -B -m btc_anytime.direction.evaluation.performance --repo . --write
      - name: Build compact performance summary
        run: python -B -m btc_anytime.direction.evaluation.performance_summary --repo . --write
      - name: Build operational performance dashboard
        run: python -B -m btc_anytime.direction.evaluation.performance_dashboard --repo . --write
      - name: Build current Direction performance context
        run: python -B -m btc_anytime.direction.evaluation.performance_context --repo . --write
      - name: Publish evaluation JSON and performance aggregate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -d output_direction/btc_anytime/v1/evaluation ]; then exit 0; fi
          git add -- output_direction/btc_anytime/v1/evaluation output_direction/btc_anytime/v1/performance
          if git diff --cached --quiet; then exit 0; fi
          python -B - <<'PY'
          import subprocess
          for line in subprocess.check_output(['git','diff','--cached','--name-status'],text=True).splitlines():
              status,path=line.split('\t',1)
              evaluation_new = status == 'A' and path.startswith('output_direction/btc_anytime/v1/evaluation/') and path.endswith('.json')
              performance_report_new = status == 'A' and path.startswith('output_direction/btc_anytime/v1/performance/reports/') and path.endswith('.json')
              performance_latest = status in ('A','M') and path == 'output_direction/btc_anytime/v1/performance/latest.json'
              summary_report_new = status == 'A' and path.startswith('output_direction/btc_anytime/v1/performance/summary_reports/') and path.endswith('.json')
              summary_latest = status in ('A','M') and path == 'output_direction/btc_anytime/v1/performance/summary_latest.json'
              dashboard_latest = status in ('A','M') and path == 'output_direction/btc_anytime/v1/performance/dashboard_latest.json'
              context_latest = status in ('A','M') and path == 'output_direction/btc_anytime/v1/performance/context_latest.json'
              if not (evaluation_new or performance_report_new or performance_latest or summary_report_new or summary_latest or dashboard_latest or context_latest):
                  raise SystemExit('Only evaluation JSON and approved performance aggregate artifacts may be committed')
          PY
          git commit -m 'Record BTC Direction evaluation outcomes and performance'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'Evaluation publication conflict; no force push permitted' >&2
          exit 1
