name: BTC Direction Performance Evaluation V1

on:
  workflow_dispatch:
  workflow_run:
    workflows: [BTC Feature Availability Evidence, BTC Direction Signal History V1]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '8,23,38,53 * * * *'

permissions:
  contents: write

concurrency:
  group: btc-direction-evaluation-v1
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record existing prospective outcomes
        id: record
        run: python -B -m btc_anytime.direction.evaluation.production --repo . --record
      - name: Build cumulative performance aggregate\n        run: python -B -m btc_anytime.direction.evaluation.performance --repo . --write\n      - name: Publish evaluation JSON and performance aggregate
        if: ${{ always() && (steps.record.outcome == 'success' || steps.record.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -d output_direction/btc_anytime/v1/evaluation ]; then exit 0; fi
          git add -- output_direction/btc_anytime/v1/evaluation output_direction/btc_anytime/v1/performance
          if git diff --cached --quiet; then exit 0; fi
          python -B - <<'PY'
          import subprocess
          for line in subprocess.check_output(['git','diff','--cached','--name-status'],text=True).splitlines():
              status,path=line.split('\t',1)
              if status!='A' or not path.startswith('output_direction/btc_anytime/v1/evaluation/') or not path.endswith('.json'):
                  raise SystemExit('Only new immutable evaluation JSON may be committed')
          PY
          git commit -m 'Record BTC Direction evaluation outcomes and performance'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'Evaluation publication conflict; no force push permitted' >&2
          exit 1
