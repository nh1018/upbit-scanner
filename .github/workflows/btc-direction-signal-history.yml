name: BTC Direction Signal History V1

on:
  workflow_dispatch:
  workflow_run:
    workflows: [BTC Feature Availability Evidence]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '12,27,42,57 * * * *'

permissions:
  contents: write

concurrency:
  group: btc-direction-signal-history-v1
  cancel-in-progress: false

jobs:
  record:
    # Production activation approved; failed upstream evidence runs do not trigger recording.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record prospective decisions, never alter ingestion
        run: python -B -m btc_anytime.direction.signal_history.runner --repo . --record
      - name: Commit only new signal ledger JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- output_direction/btc_anytime/v1
          if git diff --cached --quiet; then exit 0; fi
          python -B - <<'PY'
          import subprocess
          for line in subprocess.check_output(['git','diff','--cached','--name-status'],text=True).splitlines():
              status,path=line.split('\t',1)
              if status!='A' or not path.startswith('output_direction/btc_anytime/v1/') or not path.endswith('.json'):
                  raise SystemExit('Only append-only signal ledger JSON may be committed')
          PY
          git commit -m 'Record prospective BTC Direction signals'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            # Disjoint raw commits can rebase; any same-boundary conflict fails closed.
            git rebase origin/main
          done
          echo 'GitHub write conflict: unpublished local signals were not forced onto main' >&2
          exit 1
