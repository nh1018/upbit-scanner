name: BTC Entry Timing Engine V1

on:
  workflow_dispatch:
  workflow_run:
    workflows: [BTC Direction Signal History V1]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '14,29,44,59 * * * *'

permissions:
  contents: write

concurrency:
  group: btc-entry-timing-v1
  cancel-in-progress: false

jobs:
  record:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize baseline or record new prospective Entry boundary
        run: python -B -m btc_anytime.entry.production --repo . --record
      - name: Publish only append-only Entry JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- output_entry/btc_anytime/v1
          if git diff --cached --quiet; then exit 0; fi
          python -B - <<'PY'
          import subprocess
          for line in subprocess.check_output(['git','diff','--cached','--name-status'],text=True).splitlines():
              status,path=line.split('\t',1)
              if status!='A' or not path.startswith('output_entry/btc_anytime/v1/') or not path.endswith('.json'):
                  raise SystemExit('Only new Entry production JSON may be staged')
          PY
          git commit -m 'Record prospective BTC Entry observations'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'Entry publication conflict; no force push performed' >&2
          exit 1
