name: Chat Analysis Upbit Outcome Source V1

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'

permissions:
  contents: write

concurrency:
  group: chat-analysis-upbit-outcome-source-v1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect finalized decision-market daily candles
        run: python -B -m chat_analysis.upbit_outcome_source
      - name: Publish ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data_market/chat_analysis/upbit_1d.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update ChatGPT Upbit outcome source'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
