name: Upbit B Prospective History V1

on:
  # One-time deployment smoke run when this workflow is changed; no unrelated pushes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/upbit-b-history.yml'
      - 'upbit_b/history_runner.py'
      - 'upbit_b/history.py'
      - 'upbit_b/history_compact.py'
      - 'tests/upbit_b/test_history*.py'
  schedule:
    - cron: '7 * * * *'
    # Backup triggers for delayed or missed primary schedules; write-once prevents duplicate cycles.
    - cron: '17 * * * *'
    - cron: '27 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upbit-b-prospective-history-v1
  cancel-in-progress: false

jobs:
  activation:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.gate.outputs.active }}
    steps:
      - id: gate
        # Single activation gate. Production publication is explicitly activated for prospective Compact V1 cycles.
        run: echo 'active=true' >> "$GITHUB_OUTPUT"
  record:
    needs: activation
    if: ${{ needs.activation.outputs.active == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      UPBIT_B_HISTORY_ACTIVATED: ${{ needs.activation.outputs.active }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run B history contract regression tests
        run: python -B -m unittest discover -s tests/upbit_b -p 'test_history*.py'
      - name: Publish one validated prospective cycle; never modify collectors
        run: python -B -m upbit_b.history_runner --repo . --record --compact | tee /tmp/upbit-b-history-result.log
      - name: Verify published cycle on origin/main
        run: |
          git fetch origin main
          python - <<'PY'
          import json, pathlib, subprocess
          lines=pathlib.Path('/tmp/upbit-b-history-result.log').read_text().splitlines()
          result=json.loads(lines[-1])
          publication=result.get('publication',{})
          assert publication.get('status') in ('PUSHED','REMOTE_IDENTICAL_NOOP'), result.get('status')
          path=publication['path']
          content=subprocess.check_output(['git','show','origin/main:'+path])
          assert content and content.endswith(bytes([10])), 'published journal missing or incomplete'
          print('VERIFIED_PUBLISHED_CYCLE',path,'bytes',len(content),'status',publication['status'])
          PY
