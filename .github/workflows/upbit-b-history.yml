name: Upbit B Prospective History V1

on:
  schedule:
    - cron: '7 * * * *'
    # Backup triggers for delayed or missed primary schedules; write-once prevents duplicate cycles.
    - cron: '17 * * * *'
    - cron: '27 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upbit-b-prospective-history-v1
  cancel-in-progress: false

jobs:
  activation:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.gate.outputs.active }}
    steps:
      - id: gate
        # Single activation gate. Production publication is explicitly activated for prospective Compact V1 cycles.
        run: echo 'active=true' >> "$GITHUB_OUTPUT"
  record:
    needs: activation
    if: ${{ needs.activation.outputs.active == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      UPBIT_B_HISTORY_ACTIVATED: ${{ needs.activation.outputs.active }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish one validated prospective cycle; never modify collectors
        run: python -B -m upbit_b.history_runner --repo . --record --compact
