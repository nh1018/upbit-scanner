name: Upbit B Validation Gate V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'upbit_b/**'
      - 'tests/upbit_b/**'
      - '.github/workflows/upbit-b-validation.yml'

permissions:
  contents: read

concurrency:
  group: upbit-b-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all B data, feature, trend, and history contracts
        run: python -B -m unittest discover -s tests/upbit_b -p 'test_*.py' -v
      - name: Verify test run does not modify tracked repository files
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo 'B validation modified tracked files' >&2
            git status --short
            exit 1
          fi
