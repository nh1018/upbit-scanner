name: Upbit C Incremental Preservation V1.6

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Explicit successful C checkpoint Actions run
        required: true
        type: string
      catalog_json:
        description: Externally retained parent catalog JSON (init-catalog for first increment)
        required: true
        type: string
      catalog_sha256:
        description: External SHA256 of canonical catalog JSON plus newline
        required: true
        type: string
      generation_time_utc:
        description: Explicit UTC clock; reuse exact value from approved dry-run
        required: true
        type: string
      mode:
        type: choice
        options: [dry-run, publish]
        default: dry-run
      package_sha256:
        description: Approved incremental ZIP hash; empty for dry-run
        type: string
        default: ''
      approval:
        description: Exact PUBLISH:<package_sha256> (separate operator approval)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: upbit-c-incremental-preservation
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      prepared: ${{ steps.pin.outputs.prepared }}
      asset: ${{ steps.pin.outputs.asset }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify incremental regressions
        run: python -B -m unittest discover -s tests/upbit_b -p 'test_c_research_incremental*.py' -q
      - name: Retain hash-pinned input catalog without shell evaluation
        env:
          CATALOG: ${{ inputs.catalog_json }}
          SHA: ${{ inputs.catalog_sha256 }}
        run: |
          python -B - <<'PY'
          import os,json
          from pathlib import Path
          from upbit_c import research_incremental as I
          raw=I.encoded(json.loads(os.environ['CATALOG']))
          I.read_catalog(raw,os.environ['SHA'])
          Path(os.environ['RUNNER_TEMP'],'parent-catalog.json').write_bytes(raw)
          PY
      - name: Hydrate verified checkpoint and prepare new files only
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.source_run_id }}
          SHA: ${{ inputs.catalog_sha256 }}
          CLOCK: ${{ inputs.generation_time_utc }}
        run: >-
          python -B -m upbit_c.research_incremental_runner prepare-source
          --catalog "$RUNNER_TEMP/parent-catalog.json" --catalog-sha256 "$SHA"
          --run-id "$RUN" --generation-time "$CLOCK"
          --destination "$RUNNER_TEMP/increment" --cache "$RUNNER_TEMP/verified-cache"
          --summary "$RUNNER_TEMP/reports/prepare.json"
      - name: Pin output and approval; identical checkpoint is NOOP
        id: pin
        env:
          MODE: ${{ inputs.mode }}
          SHA: ${{ inputs.package_sha256 }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads(Path(os.environ['RUNNER_TEMP'],'reports/prepare.json').read_bytes())
          prepared=result['status']=='PREPARED'
          package=result.get('package',{})
          if prepared and os.environ['SHA'] and os.environ['SHA']!=package['sha256']:raise SystemExit('ZIP hash mismatch')
          if prepared and os.environ['MODE']=='publish':
              if os.environ['SHA']!=package['sha256'] or os.environ['APPROVAL']!='PUBLISH:'+package['sha256']:
                  raise SystemExit('Explicit approval required')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('prepared='+str(prepared).lower()+'\nasset='+package.get('asset_name','')+'\nsha='+package.get('sha256','')+'\n')
          PY
      - name: Read-only remote dependency and duplicate/fork inspection
        if: steps.pin.outputs.prepared == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.pin.outputs.asset }}
          SHA: ${{ steps.pin.outputs.sha }}
          CATALOG_SHA: ${{ inputs.catalog_sha256 }}
        run: >-
          python -B -m upbit_c.research_incremental_runner publish
          --catalog "$RUNNER_TEMP/parent-catalog.json" --catalog-sha256 "$CATALOG_SHA"
          --package "$RUNNER_TEMP/increment/$ASSET" --sha256 "$SHA"
          --cache "$RUNNER_TEMP/verified-cache" --summary "$RUNNER_TEMP/reports/plan.json"
      - uses: actions/upload-artifact@v4
        if: steps.pin.outputs.prepared == 'true'
        with:
          name: c-incremental-prepared
          path: ${{ runner.temp }}/increment/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c-incremental-verification
          path: ${{ runner.temp }}/reports/
          retention-days: 90
          if-no-files-found: warn

  publish:
    needs: verify
    if: inputs.mode == 'publish' && needs.verify.outputs.prepared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: c-incremental-prepared
          path: ${{ runner.temp }}/increment/
      - name: Validate externally pinned parent catalog
        env:
          CATALOG: ${{ inputs.catalog_json }}
          SHA: ${{ inputs.catalog_sha256 }}
        run: |
          python -B - <<'PY'
          import os,json
          from pathlib import Path
          from upbit_c import research_incremental as I
          raw=I.encoded(json.loads(os.environ['CATALOG']));I.read_catalog(raw,os.environ['SHA'])
          Path(os.environ['RUNNER_TEMP'],'parent-catalog.json').write_bytes(raw)
          PY
      - name: Explicit publication and full download verification
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ needs.verify.outputs.asset }}
          SHA: ${{ needs.verify.outputs.sha }}
          CATALOG_SHA: ${{ inputs.catalog_sha256 }}
          APPROVAL: ${{ inputs.approval }}
        run: >-
          python -B -m upbit_c.research_incremental_runner publish
          --catalog "$RUNNER_TEMP/parent-catalog.json" --catalog-sha256 "$CATALOG_SHA"
          --package "$RUNNER_TEMP/increment/$ASSET" --sha256 "$SHA" --approval "$APPROVAL"
          --summary "$RUNNER_TEMP/publication/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c-incremental-publication
          path: ${{ runner.temp }}/publication/
          retention-days: 90
          if-no-files-found: warn
