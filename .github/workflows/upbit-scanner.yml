name: Upbit Scanner

on:
  # Allow an audited recovery smoke run on workflow changes without changing scanner logic.
  push:
    branches: [main]
    paths:
      - '.github/workflows/upbit-scanner.yml'
  workflow_dispatch:
  schedule:
    # GitHub scheduled workflows are best-effort and can be delayed at the top of the hour.
    # Offset the job away from :00/:15 congestion; Health V1 fails closed if output becomes stale.
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: upbit-a-v13-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scanner
        run: python -u upbit_binance_scanner.py

      - name: Verify scanner contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("output/latest_scan.json")
          if not p.exists():
              raise SystemExit("latest_scan.json missing")
          x=json.loads(p.read_text(encoding="utf-8"))
          assert x.get("scanner_version")=="1.3-cloud"
          assert int(x.get("scanned_count",0))>0
          assert x.get("generated_at_kst")
          print("verified",x["generated_at_kst"],x["scanned_count"],x.get("binance_status"))
          PY

      - name: Commit scan results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- output data/scan_history_v13.csv
          if git diff --cached --quiet; then
            echo "No scanner output changes"
            exit 0
          fi
          git commit -m "Update scanner results"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to publish scanner results after retries" >&2
          exit 1
